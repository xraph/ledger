schemaVersion: 1
contributor:
  name: ledger
  envelope:
    supports: [v1]
    preferred: v1
  capabilities: [ledger.read, ledger.write]

# Each surface's task appends its intents below. Queries are capability read,
# commands capability write, and every command lists what it invalidates.
intents:
  # Plans
  - { name: plans.list,           kind: query,   version: 1, capability: read }
  - { name: plans.detail,         kind: query,   version: 1, capability: read }
  - { name: plans.create,         kind: command, version: 1, capability: write, invalidates: [plans.list, overview.stats] }
  - { name: plans.update,         kind: command, version: 1, capability: write, invalidates: [plans.list, plans.detail, subscriptions.detail, subscriptions.usage, entitlements.check] }
  - { name: plans.archive,        kind: command, version: 1, capability: write, invalidates: [plans.list, plans.detail, overview.stats, subscriptions.detail] }
  - { name: plans.activate,       kind: command, version: 1, capability: write, invalidates: [plans.list, plans.detail, overview.stats, subscriptions.detail] }
  - { name: plans.delete,         kind: command, version: 1, capability: write, invalidates: [plans.list, overview.stats] }
  - { name: plans.syncToProvider, kind: command, version: 1, capability: write, invalidates: [plans.detail] }

  # Features (the reusable catalog)
  - { name: features.list,           kind: query,   version: 1, capability: read }
  - { name: features.detail,         kind: query,   version: 1, capability: read }
  - { name: features.create,         kind: command, version: 1, capability: write, invalidates: [features.list] }
  - { name: features.update,         kind: command, version: 1, capability: write, invalidates: [features.list, features.detail] }
  - { name: features.archive,        kind: command, version: 1, capability: write, invalidates: [features.list, features.detail] }
  - { name: features.delete,         kind: command, version: 1, capability: write, invalidates: [features.list] }
  - { name: features.syncToProvider, kind: command, version: 1, capability: write, invalidates: [features.detail] }

  # Subscriptions
  - { name: subscriptions.list,           kind: query,   version: 1, capability: read }
  - { name: subscriptions.detail,         kind: query,   version: 1, capability: read }
  - { name: subscriptions.usage,          kind: query,   version: 1, capability: read }
  - { name: subscriptions.create,         kind: command, version: 1, capability: write, invalidates: [subscriptions.list, overview.stats, entitlements.check, paymentMethods.list] }
  - { name: subscriptions.changePlan,     kind: command, version: 1, capability: write, invalidates: [subscriptions.list, subscriptions.detail, subscriptions.usage, entitlements.check] }
  - { name: subscriptions.pause,          kind: command, version: 1, capability: write, invalidates: [subscriptions.list, subscriptions.detail, overview.stats, entitlements.check] }
  - { name: subscriptions.resume,         kind: command, version: 1, capability: write, invalidates: [subscriptions.list, subscriptions.detail, overview.stats, entitlements.check] }
  - { name: subscriptions.cancel,         kind: command, version: 1, capability: write, invalidates: [subscriptions.list, subscriptions.detail, overview.stats, entitlements.check] }
  - { name: subscriptions.syncToProvider, kind: command, version: 1, capability: write, invalidates: [subscriptions.detail] }

  # Invoices
  - { name: invoices.list,           kind: query,   version: 1, capability: read }
  - { name: invoices.detail,         kind: query,   version: 1, capability: read }
  - { name: invoices.pending,        kind: query,   version: 1, capability: read }
  - { name: invoices.export,         kind: query,   version: 1, capability: read }
  - { name: invoices.generate,       kind: command, version: 1, capability: write, invalidates: [invoices.list, invoices.pending, subscriptions.detail, overview.stats, overview.recentInvoices] }
  - { name: invoices.finalize,       kind: command, version: 1, capability: write, invalidates: [invoices.list, invoices.detail, invoices.pending, overview.stats, overview.recentInvoices] }
  - { name: invoices.markPaid,       kind: command, version: 1, capability: write, invalidates: [invoices.list, invoices.detail, invoices.pending, overview.stats, overview.recentInvoices] }
  - { name: invoices.void,           kind: command, version: 1, capability: write, invalidates: [invoices.list, invoices.detail, invoices.pending, overview.stats, overview.recentInvoices] }
  - { name: invoices.syncToProvider, kind: command, version: 1, capability: write, invalidates: [invoices.detail] }

  # Coupons
  - { name: coupons.list,   kind: query,   version: 1, capability: read }
  - { name: coupons.detail, kind: query,   version: 1, capability: read }
  - { name: coupons.create, kind: command, version: 1, capability: write, invalidates: [coupons.list, overview.stats] }
  - { name: coupons.update, kind: command, version: 1, capability: write, invalidates: [coupons.list, coupons.detail, subscriptions.detail] }
  - { name: coupons.delete, kind: command, version: 1, capability: write, invalidates: [coupons.list, subscriptions.detail, overview.stats] }
  - { name: coupons.apply,  kind: command, version: 1, capability: write, invalidates: [coupons.list, coupons.detail, subscriptions.detail] }

  # Usage, entitlements and payment methods
  - { name: usage.events,            kind: query,   version: 1, capability: read }
  - { name: usage.aggregate,         kind: query,   version: 1, capability: read }
  - { name: entitlements.check,      kind: query,   version: 1, capability: read }
  - { name: entitlements.invalidate, kind: command, version: 1, capability: write, invalidates: [entitlements.check, subscriptions.usage] }
  - { name: paymentMethods.list,     kind: query,   version: 1, capability: read }

  # Overview and settings
  - { name: overview.stats,          kind: query, version: 1, capability: read }
  - { name: overview.recentInvoices, kind: query, version: 1, capability: read }
  - { name: settings.detail,         kind: query, version: 1, capability: read }
